name: Triage size issue

# Checks the evidence in a size-change issue and posts the findings back.
# Re-runs on every edit, so a contributor can fix the issue and watch the
# report update rather than waiting on a maintainer.
#
# It never decides whether a number is *correct* — only whether the claim is
# supported well enough to be worth a human's time.

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: read
  issues: write

jobs:
  triage:
    # Only size-related issues, and never our own monthly source-check issue.
    if: >-
      contains(join(github.event.issue.labels.*.name, ','), 'size') &&
      !contains(join(github.event.issue.labels.*.name, ','), 'source-check')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Write issue body to a file
        env:
          # Via env, never inlined into the shell — issue bodies are untrusted.
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: printf '%s' "$ISSUE_BODY" > issue-body.md

      - name: Triage
        id: triage
        run: node scripts/triage-issue.js --body-file issue-body.md --out report.md

      - name: Post or update the triage comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('report.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            // Update our previous report instead of stacking comments.
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );
            const mine = comments.find(
              (c) => c.user.type === 'Bot' && c.body.includes('<!-- triage-report -->')
            );

            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

            // Label reflects the current state, so the issue list is triaged at a glance.
            const needsInfo = '${{ steps.triage.outputs.status }}' === 'needs-info';
            const labels = context.payload.issue.labels.map((l) => l.name);

            if (needsInfo && !labels.includes('needs-info')) {
              await github.rest.issues.addLabels({
                owner, repo, issue_number, labels: ['needs-info'],
              });
            }
            if (!needsInfo && labels.includes('needs-info')) {
              await github.rest.issues.removeLabel({
                owner, repo, issue_number, name: 'needs-info',
              }).catch(() => {});
            }
